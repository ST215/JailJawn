[project]
name = "jailjawn"
version = "2.2.0"
description = "Collects the Philadelphia Department of Prisons daily headcount and census into a git repository."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Stanley Griggs II" }]
dependencies = [
    "beautifulsoup4>=4.15",
    "playwright>=1.62",
]

[project.scripts]
jailjawn = "jailjawn.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "black>=26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jailjawn"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py313"]
