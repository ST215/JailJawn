name: Deploy site

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      # The page fetches census.csv from the repository at load time so it is
      # always current; the copies bundled here are the fallback. The feeds
      # are served from here, so the scrape workflow redeploys after a commit.
      - name: Assemble site
        run: |
          mkdir -p _site/legacy
          cp -r site/. _site/
          cp census.csv feed.xml feed.json latest.json _site/
          cp legacy/summary.csv _site/legacy/summary.csv

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
