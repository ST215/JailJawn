name: Daily Scrape

on:
  schedule:
    # Twice daily. Scheduled runs on shared runners start 30 to 90 minutes
    # late; the second pass catches a late census post. The scraper exits
    # without committing when the census date is already stored.
    - cron: "0 12 * * *" # 12:00 UTC, 8:00 AM Philadelphia (EDT)
    - cron: "0 18 * * *" # 18:00 UTC, 2:00 PM Philadelphia (EDT)
  workflow_dispatch: # Allow manual trigger

# Never run two scrapes at once; they would race on the push.
concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # to redeploy the site after a data commit

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Scrape the census
        env:
          PYTHONUNBUFFERED: "1"
        run: uv run jailjawn scrape

      - name: Commit and push new census data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ raw/ census.csv feed.xml feed.json latest.json
          if git diff --cached --quiet; then
            echo "No new census to commit."
            exit 0
          fi
          census=$(git diff --cached --name-only -- data/ | sed -E 's#data/(.*)\.json#\1#' | head -1)
          git commit -m "data: census for ${census}"
          git push origin HEAD:${{ github.ref_name }}
          echo "deployed=true" >> "$GITHUB_OUTPUT"
        id: commit

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so the
      # site (which serves the feeds) is redeployed by hand here.
      - name: Redeploy the site
        if: steps.commit.outputs.deployed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref ${{ github.ref_name }}
